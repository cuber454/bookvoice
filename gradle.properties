# Кучу держим маленькой: контейнер ограничен ~1.5 GB, большой демон
# валится OOM-kill'ом («daemon disappeared»). 768m + агент переваливали
# лимит на :app:packageDebug — ужали до 512m/256m.
# Проверки компиляции при занятой сессии (anon-база ~700MB) могут не
# влезать в 512m-кучу — тогда временно ужимай до -Xmx320m + SerialGC.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=1
android.useAndroidX=true
android.nonTransitiveRClass=true
