name: keystore-recover

# ВРЕМЕННАЯ диагностика (#35): восстановить keystore из секрета, показать его
# отпечаток и отдать файл артефактом, чтобы сверить с подписью установленных
# сборок (81b49c78…). После сверки workflow удаляется.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore keystore from secret
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Print fingerprint
        run: |
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey 2>&1 | grep -iE "SHA256|SHA1:" || echo "KEYTOOL_FAILED"

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: $HOME/.android/debug.keystore
          if-no-files-found: error
